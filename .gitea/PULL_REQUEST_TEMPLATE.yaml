name: Pull Request Template
about: Use this template for creating a pull request

body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: package
    attributes:
      label: Package Changes
      description: |
        Dependency changes only (npm packages from package.json, Rust crates from Cargo.toml),
        listed as a table using the actions Added, Removed or Updated. Write "None" if there are none.
        For example:
        | Package | Action | Version |
        | --- | --- | --- |
        | svelte-adapter-bun | Added | 1.0.1 |
        | svelte | Updated | 5.55.1 -> 5.55.5 |
        | eslint-plugin-import | Removed | 2.32.0 |
      placeholder: |
        | Package | Action | Version |
        | --- | --- | --- |

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots

  - type: textarea
    id: reference
    attributes:
      label: Reference
      placeholder: "Resolves #ISSUE_NUMBER"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: A milestone is set
        - label: The related issues has been linked to this branch
