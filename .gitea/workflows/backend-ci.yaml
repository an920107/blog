name: Backend CI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

defaults:
  run:
    working-directory: ./backend

env:
  # No database is available in CI, so the sqlx macros resolve against the
  # committed .sqlx cache instead of a live database.
  SQLX_OFFLINE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # The Cargo workspace lives in backend/, not at the repo root.
          # rust-cache resolves this relative to the repo root, not working-directory.
          workspaces: backend

      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy

      - name: Test
        run: cargo test
