# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0-standalone-strict/all.json

apiVersion: v1
kind: Pod
metadata:
  name: __NAME__
spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:17-alpine
      env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __NAME__-secret
              key: DATABASE_PASSWORD
      volumeMounts:
        - name: __NAME__-postgres
          mountPath: /var/lib/postgresql/data
    - name: qdrant
      image: docker.io/qdrant/qdrant:v1.17
      env:
        - name: QDRANT__SERVICE__API_KEY
          valueFrom:
            secretKeyRef:
              name: __NAME__-secret
              key: QDRANT_API_KEY
      volumeMounts:
        - name: __NAME__-qdrant
          mountPath: /qdrant/storage
    - name: redis
      image: docker.io/library/redis:7-alpine
    - name: backend
      image: __BACKEND_IMAGE__:__BACKEND_TAG__
      env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __NAME__-secret
              key: DATABASE_PASSWORD
        - name: SESSION_KEY
          valueFrom:
            secretKeyRef:
              name: __NAME__-secret
              key: SESSION_KEY
        - name: OIDC_ISSUER_URL
          valueFrom:
            secretKeyRef:
              name: __NAME__-config
              key: OIDC_ISSUER_URL
        - name: OIDC_REDIRECT_URL
          valueFrom:
            secretKeyRef:
              name: __NAME__-config
              key: OIDC_REDIRECT_URL
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: __NAME__-config
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: __NAME__-secret
              key: OIDC_CLIENT_SECRET
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: __NAME__-secret
              key: QDRANT_API_KEY
        - name: QDRANT_SEARCH_THRESHOLD
          valueFrom:
            secretKeyRef:
              name: __NAME__-config
              key: QDRANT_SEARCH_THRESHOLD
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: __NAME__-config
              key: BACKEND_SENTRY_DSN
      volumeMounts:
        - name: __NAME__-localtime
          mountPath: /etc/localtime
          readOnly: true
        - name: __NAME__-storage
          mountPath: /app/static
        - name: __NAME__-embedding-cache
          mountPath: /app/embedding_cache
      ports:
        - hostPort: __BACKEND_PORT__
          hostIP: 127.0.0.1
          containerPort: 8080
    - name: frontend
      image: __FRONTEND_IMAGE__:__FRONTEND_TAG__
      env:
        - name: PUBLIC_API_BASE_URL
          valueFrom:
            secretKeyRef:
              name: __NAME__-config
              key: API_BASE_URL
        - name: PUBLIC_APP_BASE_URL
          valueFrom:
            secretKeyRef:
              name: __NAME__-config
              key: APP_BASE_URL
        - name: PUBLIC_GA_MEASUREMENT_ID
          valueFrom:
            secretKeyRef:
              name: __NAME__-config
              key: GA_MEASUREMENT_ID
        - name: PUBLIC_ADSENSE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: __NAME__-config
              key: ADSENSE_CLIENT_ID
        - name: PUBLIC_SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: __NAME__-config
              key: FRONTEND_SENTRY_DSN
      volumeMounts:
        - name: __NAME__-localtime
          mountPath: /etc/localtime
          readOnly: true
      ports:
        - hostPort: __FRONTEND_PORT__
          hostIP: 127.0.0.1
          containerPort: 3000
  volumes:
    - name: __NAME__-localtime
      hostPath:
        path: /etc/localtime
    - name: __NAME__-postgres
      persistentVolumeClaim:
        claimName: __NAME__-postgres
    - name: __NAME__-qdrant
      persistentVolumeClaim:
        claimName: __NAME__-qdrant
    - name: __NAME__-storage
      persistentVolumeClaim:
        claimName: __NAME__-storage
    - name: __NAME__-embedding-cache
      persistentVolumeClaim:
        claimName: __NAME__-embedding-cache
